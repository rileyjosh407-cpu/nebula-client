name: Build mod jar

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build
        run: |
          set +e
          gradle clean build --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = [l.rstrip() for l in open('build.log', errors='replace')]
          keep = []
          for i, l in enumerate(lines):
              if re.search(r'error:|What went wrong|FAILED|Could not|Unsupported|not found|cannot find symbol|does not exist|Caused by|Exception', l, re.I):
                  keep.extend(lines[max(0, i-1):i+4])
          out = []
          seen = set()
          for l in keep:
              if l not in seen and not l.strip().startswith('at '):
                  seen.add(l)
                  out.append(l)
          msg = '\n'.join(out[:70]) or '\n'.join(lines[-40:])
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=BuildLog::' + msg)
          PY
          fi
          exit $code

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: nebula-client-mod
          path: |
            build/libs/nebula-client-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/nebula-client-*.jar | grep -v -- '-sources' | head -n 1)
          echo "Publishing $JAR"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Nebula Client (latest build)" \
            --notes "Fabric 1.21.11 mod. Download the .jar below, put it in your mods folder with Fabric Loader 0.19.x and Fabric API 0.141.3+1.21.11."
